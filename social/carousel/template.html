<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <title>TapLocal — Carrossel</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

      :root {
        --taplocal-blue: #005afc;
        --body-text: #111111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1350px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #ffffff;
        color: var(--body-text);
        font-family: 'Poppins', Arial, sans-serif;
      }

      .slide {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 1080px;
        height: 1350px;
        padding: 92px 96px 78px;
        background: #ffffff;
      }

      .accent-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 18px;
        height: 224px;
        border-radius: 0 0 12px 0;
        background: var(--taplocal-blue);
      }

      .title {
        max-width: 850px;
        margin: 0;
        color: var(--taplocal-blue);
        font-size: 68px;
        font-weight: 700;
        letter-spacing: -1.8px;
        line-height: 1.08;
      }

      .body {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        max-width: 850px;
        margin: 22px auto 34px;
        text-align: center;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: -0.8px;
        line-height: 1.3;
      }

      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        min-height: 112px;
        padding-top: 24px;
        border-top: 2px solid var(--taplocal-blue);
      }

      .footer-copy {
        max-width: 640px;
        margin: 0;
        color: var(--taplocal-blue);
        font-size: 27px;
        font-weight: 600;
        line-height: 1.25;
      }

      .wordmark {
        display: block;
        flex: 0 0 auto;
        width: 214px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="slide" aria-label="Slide de carrossel TapLocal">
      <div class="accent-bar" aria-hidden="true"></div>
      <h1 class="title" data-field="title"></h1>
      <p class="body" data-field="body"></p>
      <footer class="footer">
        <p class="footer-copy" data-field="footer"></p>
        <img class="wordmark" src="../../assets/taplocal-logo.png" alt="TapLocal">
      </footer>
    </main>
  </body>
</html>
